name: Android build

# Builds the game as an Android app (arm64), a proof of concept: touch controls, no controller support yet.  Run it from the Actions tab.
# Artifact `ts-rust-android`: install the .apk, give the app "All files access" (Settings > Apps > TimeSplitters), start it once (it makes
# a folder TimeSplitters in the device's storage), copy the game's PAK/ and MUSIC/ (and mods/) into that folder and start the app again.
on:
  workflow_dispatch:
  push:
    branches: [android]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: cargo-apk
        run: cargo install cargo-apk --locked
      - name: Android platform 33 (the one the app is built against)
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2" || true
      - name: Debug keystore (the app is signed with it)
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build
        working-directory: ts-rust
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo apk build --release -p ts-port --lib --features extensions,extended-tables,high-framerate
      - uses: actions/upload-artifact@v4
        with:
          name: ts-rust-android
          path: build/cargo/release/apk/ts-port.apk
