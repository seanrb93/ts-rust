[package]
name = "ts-sdk"
version = "0.1.0"
edition = "2021"

[dependencies]
ts-rt = { path = "../ts-rt" }
ts-audio = { path = "../ts-audio" }
# the maths of a network game: the same results on every platform (the platforms' own libraries differ in the last bit)
libm = "0.2"
# what a machine sends to bring the others back into step
miniz_oxide = "0.8"

[features]
calltrace = ["ts-rt/calltrace"]
shadow = ["ts-rt/shadow"]
