[package]
name = "ts-port"
version = "0.1.0"
edition = "2021"

[dependencies]
ts-rt = { path = "../ts-rt" }
ts-sdk = { path = "../ts-sdk" }
ts-game = { path = "../ts-game" }
ts-gfx = { path = "../ts-gfx" }
ts-render = { path = "../ts-render" }
wgpu = "22"
winit = "0.30"
pollster = "0.3"
sdl3 = { version = "0.20", default-features = false, features = ["build-from-source-static"] }
cpal = "0.15"
png = "0.17"
ts-audio = { path = "../ts-audio" }
ts-verify = { path = "../ts-verify", optional = true, features = ["shadow-hook"] }

[features]
calltrace = ["ts-game/calltrace", "ts-rt/calltrace", "ts-sdk/calltrace"]
watch = ["ts-game/watch", "ts-rt/watch"]
shadow = ["ts-game/shadow", "ts-rt/shadow", "dep:ts-verify"]
extended-tables = ["ts-game/extended-tables"]
# frame rates above 60 Hz (the `framerate` setting): off while the code is made to match the original exactly
high-framerate = ["ts-game/high-framerate"]
extensions = ["ts-game/extensions"]
# everything the port adds to the game
all-extensions = ["extensions", "extended-tables", "high-framerate"]
