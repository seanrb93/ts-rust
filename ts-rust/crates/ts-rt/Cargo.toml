[package]
name = "ts-rt"
version = "0.1.0"
edition = "2021"

[dependencies]

[features]
# Keeps the pages a tick changes so that the memory can go back some ticks (rollback in a network game).
journal = []
# Records every store (with the overwritten bytes) so a verifier can compare / roll back memory effects.
trace = []

# Per-function entry tracing for hang diagnosis.
calltrace = []
watch = []
# A budget of memory accesses for a run of the port's code, which the verifier sets: past it the run ends with a fault (a loop that random data makes
# endless, which the original's interpreter stops by its count of instructions).
fuel = []
shadow = ["trace"]
