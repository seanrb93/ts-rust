[package]
name = "ts-game"
version = "0.1.0"
edition = "2021"

[dependencies]
ts-rt = { path = "../ts-rt" }
ts-sdk = { path = "../ts-sdk" }
ts-audio = { path = "../ts-audio" }

[features]
calltrace = ["ts-rt/calltrace"]
watch = ["ts-rt/watch"]
shadow = ["ts-rt/shadow", "ts-sdk/shadow"]
# the port tables that are larger than the game's own (props and rooms, weapon combinations, levels of mods): off while the code is made to match the original exactly
extended-tables = []
