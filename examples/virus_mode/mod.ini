name = Virus
enabled = true

[settings]
# Change a value, save this file and start the game again.

# Seconds at the start of a match when nobody can be infected.
grace = 30

# Seconds a touch has to last to infect (0: the first touch infects).
contact_time = 0

# Seconds a character just infected has to wait before it can infect anyone.
immune = 6

# How close the infected has to come to touch, in units (a player reaches 0.3 further).
touch = 1.3

# How fast the infected bots run, as a part of their own speed (1: as fast as the survivors).
infected_speed = 0.8

# How many start infected.
start_infected = 1
