# The settings of Brick Throw.  Change a value, save this file and start the game again.

# How fast the brick leaves the hand (units a frame; the game's own is 0.2, the grenade launcher's grenade 0.85).
throw_speed = 0.85

# How much it goes up as it leaves (0: straight; with 0.07 it meets a person at the crosshair up to about 14 units away).
lift = 0.07
