# The settings of Bots Can Punch.  Change a value, save this file and start the game again.

# How near a bot has to be to hit (units; a character is about 2 tall).
reach = 2.5

# How near in height it has to be (1.5: on the same floor).
height = 1.5

# What a punch takes, as a part of a character's health (1 is all of it; a pistol shot is 0.3).
damage = 0.5

# Seconds between two punches of the same bot.
wait = 0.75
