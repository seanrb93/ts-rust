# The settings of Weapon Balance.  Change a value, save this file and start the game again.
# Every machine of a network game needs the same settings (a machine with other settings cannot join).

# How hard the guns hit, in percent of this mod's balance: 100 is as balanced, 120 a fifth harder, 80 a fifth softer.
gun_damage = 100

# How strong the explosions are, in percent of this mod's: 100 is as balanced (rockets as the game has them, grenades 0.9,
# mines 0.8, the Scifi Autorifle's grenade 0.35 of the game's), 125 is about the game's own for all of them.
explosion_strength = 100

# Balance the shotguns (yes), or leave the Shotgun, Assault Shotgun and Blunderbuss as the game has them (no).
balance_shotguns = yes

# Carry less ammunition, so that no one has a weapon full for the whole match (yes), or as the game has it (no).
limit_ammo = yes

# The bots fire no faster than a player can (yes), or as the game has it (no).
bots_fire_like_players = yes
